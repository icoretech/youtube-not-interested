name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag with a draft GitHub Release to publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: youtube-not-interested-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name || inputs.tag }}
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: youtube-not-interested-release
          path: downloads
      - name: Publish verified downloads
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          sha256sum --check SHA256SUMS
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$draft" != true ]]; then
            echo "::error::Release $TAG is already public. Existing downloads are preserved."
            exit 1
          fi
          gh release upload "$TAG" youtube-not-interested-chrome.zip youtube-not-interested-firefox-unsigned.zip youtube-not-interested-review-source.zip SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false

  stores:
    needs: [prepare, publish]
    uses: ./.github/workflows/stores.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
