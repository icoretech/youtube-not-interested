name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Build the exact release tag and retain the download files.
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$TAG" == "v$version" ]]
          [[ "$version" == "$(node -p 'require("./manifest/base.json").version')" ]]
          [[ "$version" == "$(node -p 'require("./package-lock.json").packages[""].version')" ]]
      - run: npm ci
      - run: npm run biome:ci
      - run: npm test
      - run: npm run package
      - run: npm run web-ext:lint
      - run: npm run package:review-source
      - name: Collect browser packages and source
        if: inputs.tag != ''
        run: |
          mkdir -p "$RUNNER_TEMP/youtube-not-interested-release"
          cp artifacts/chrome/*.zip "$RUNNER_TEMP/youtube-not-interested-release/youtube-not-interested-chrome.zip"
          cp artifacts/firefox/*.zip "$RUNNER_TEMP/youtube-not-interested-release/youtube-not-interested-firefox-unsigned.zip"
          cp artifacts/source/youtube-not-interested-review-source-*.zip "$RUNNER_TEMP/youtube-not-interested-release/youtube-not-interested-review-source.zip"
          cd "$RUNNER_TEMP/youtube-not-interested-release"
          sha256sum -- *.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.tag != ''
        with:
          name: youtube-not-interested-release
          path: ${{ runner.temp }}/youtube-not-interested-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
